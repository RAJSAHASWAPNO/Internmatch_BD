{% if breadcrumbs %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    {% for item in breadcrumbs %}
      {% if forloop.last %}
        <li class="breadcrumb-item active">{{ item }}</li>
      {% else %}
        <li class="breadcrumb-item"><a href="{{ item.url }}">{{ item.name }}</a></li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>
{% endif %}
