{% block page_hero %}
<section class="site-hero inner-page" style="background-image:url({% static 'images/hero_1.webp' %})">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h1>{{ page_title }}</h1>
        {% if page_subtitle %}
          <p>{{ page_subtitle }}</p>
        {% endif %}
      </div>
    </div>
  </div>
</section>
{% endblock %}
